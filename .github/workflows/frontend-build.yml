name: Frontend build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eletrorecicla-dist
          path: dist/
